<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Prism Zero verification and training workflow</title>
<desc id="desc">A trusted task goes to local generation, envelope parsing and symbolic checks. Rejected candidates receive bounded feedback. Accepted candidates enter JSONL, review, separate LoRA training and held-out evaluation. No automatic model promotion.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="540" rx="24" fill="#101526"/>
<g font-family="system-ui,Segoe UI,sans-serif"><text x="40" y="55" fill="#f8fafc" font-size="27" font-weight="700">The verification loop</text><text x="40" y="85" fill="#94a3b8" font-size="16">Illustrative architecture, not captured execution or a quality guarantee.</text>
<g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"><path d="M250 180H295"/><path d="M505 180H550"/><path d="M760 180H805"/><path d="M655 230V275H400V230"/><path d="M1015 180H1060V365H1015"/><path d="M805 365H760"/><path d="M550 365H505"/><path d="M295 365H250"/></g>
<g stroke-width="2"><rect x="40" y="130" width="210" height="100" rx="14" fill="#20233b" stroke="#64748b"/><rect x="295" y="130" width="210" height="100" rx="14" fill="#302347" stroke="#a78bfa"/><rect x="550" y="130" width="210" height="100" rx="14" fill="#183249" stroke="#38bdf8"/><rect x="805" y="130" width="210" height="100" rx="14" fill="#153c35" stroke="#34d399"/><rect x="805" y="315" width="210" height="100" rx="14" fill="#153c35" stroke="#34d399"/><rect x="550" y="315" width="210" height="100" rx="14" fill="#20233b" stroke="#64748b"/><rect x="295" y="315" width="210" height="100" rx="14" fill="#302347" stroke="#a78bfa"/><rect x="40" y="315" width="210" height="100" rx="14" fill="#20233b" stroke="#64748b"/></g>
<g fill="#f1f5f9" text-anchor="middle" font-size="20" font-weight="600"><text x="145" y="174">Trusted task</text><text x="400" y="174">Local generator</text><text x="655" y="174">Verify candidate</text><text x="910" y="174">Accepted JSONL</text><text x="910" y="359">Review dataset</text><text x="655" y="359">Local LoRA SFT</text><text x="400" y="359">Adapter artifact</text><text x="145" y="359">Held-out evaluation</text></g>
<g fill="#cbd5e1" text-anchor="middle" font-size="15"><text x="145" y="202">Independent constraints</text><text x="400" y="202">Scripted or local weights</text><text x="655" y="202">Envelope + symbolic rules</text><text x="910" y="202">Passing candidates only</text><text x="910" y="387">Separate explicit decision</text><text x="655" y="387">Optional weight update</text><text x="400" y="387">Base checkpoint required</text><text x="145" y="387">Compare against baseline</text></g>
<text x="420" y="260" fill="#fbbf24" font-size="14">REJECT: feedback + bounded retry</text><text x="780" y="290" fill="#94a3b8" font-size="13">Path to review</text>
<rect x="40" y="450" width="1120" height="55" rx="12" fill="#1e293b"/><text x="65" y="484" fill="#e2e8f0" font-size="17">Checks validate configured constraints, not arbitrary reasoning. No automatic adapter promotion.</text></g>
</svg>
