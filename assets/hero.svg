<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Prism Zero: local generation and explicit verification</title>
<desc id="desc">Illustrative hero artwork. A purple prism separates neural generation, symbolic verification and curated data. Not a benchmark or screenshot.</desc>
