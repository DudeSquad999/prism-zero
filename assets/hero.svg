<g font-family="system-ui,Segoe UI,sans-serif"><text x="330" y="104" fill="#a78bfa" font-size="15" letter-spacing="4">OFFLINE-FIRST REASONING TOOLKIT</text><text x="325" y="176" fill="#f8fafc" font-size="64" font-weight="750" letter-spacing="2">PRISM ZERO</text><text x="330" y="218" fill="#cbd5e1" font-size="23">Generate locally. Verify explicitly. Train deliberately.</text><g font-size="15"><rect x="330" y="250" width="193" height="38" rx="19" fill="#342657"/><text x="351" y="275" fill="#ddd6fe">LOCAL GENERATION</text><rect x="537" y="250" width="214" height="38" rx="19" fill="#153449"/><text x="558" y="275" fill="#bae6fd">SYMBOLIC CHECKS</text><rect x="765" y="250" width="197" height="38" rx="19" fill="#123b34"/><text x="786" y="275" fill="#a7f3d0">CURATED JSONL</text></g></g>
