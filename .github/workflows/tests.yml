name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    name: Core (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m "not ml"
      - run: python examples/quickstart.py
      - run: python -m compileall -q prism_zero examples tests

  ml:
    name: ML integration (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[ml,dev]"
      - name: CPU-only torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu --force-reinstall torch
      - run: python -m pytest -q
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'

  package:
    name: Wheel build and clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          cd /tmp && mkdir -p run && cd run
          /tmp/clean/bin/prism-zero --help
          /tmp/clean/bin/prism-zero-train --help
          /tmp/clean/bin/python -c "import prism_zero"  # no torch installed: core import must not require it
          /tmp/clean/bin/prism-zero doctor --json > doctor.json
          /tmp/clean/bin/python -c "import json; json.load(open('doctor.json'))"
